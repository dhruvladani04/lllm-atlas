# Install scripts are opt-in, one package at a time.
#
# esbuild needs its postinstall to place the platform binary that tsx and Vitest run on.
# unrs-resolver's postinstall only probes for a prebuilt native binding, which pnpm has
# already installed as an optional dependency, so it is denied rather than trusted.
allowBuilds:
  esbuild: true
  unrs-resolver: false
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - sharp
strictDepBuilds: false
