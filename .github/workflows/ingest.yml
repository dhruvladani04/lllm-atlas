name: ingest

# specs/01-architecture/data-pipeline.md — daily at 06:00 UTC, plus manual trigger.
# The job commits to the repository; the commit is what triggers a deploy. This is
# deliberately not Vercel Cron: the snapshot history is the point.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A source failing is recorded, not fatal. The step fails only when a source has
      # failed three runs in a row, and even then the data written so far is committed
      # below so the log records the failure.
      - name: Fetch, validate and write snapshots
        id: ingest
        continue-on-error: true
        run: pnpm ingest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # The commit below is what deploys the site, so the data has to be shown to build
      # before it is committed. Every page parses these files with Zod at build time; a
      # snapshot that fails here would otherwise reach Vercel as a broken deploy. If this
      # step fails nothing is committed, and the site keeps serving the last good data.
      - name: Check the site builds on the new data
        run: pnpm build

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git commit -m "data(ingest): snapshot $(date -u +%Y-%m-%d)"
          git push

      - name: Fail the run if a source needs attention
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "A source has failed three runs in a row. See data/meta/ingestion-log.json."
          exit 1
